# ~/.tmux.conf — symlinked here by macos-bootstrap.

# --- basics ----------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true colour
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10                      # no ESC lag inside nvim
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- prefix: C-a instead of C-b --------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- splits: | and - are easier to remember --------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "config reloaded"

# --- vim-style pane navigation ---------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- copy mode: vi keys, into the macOS pasteboard -------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- status line -----------------------------------------------------
set -g status-position bottom
set -g status-style "bg=default fg=colour245"
set -g status-left "#[fg=colour39,bold] #S "
set -g status-right "#[fg=colour245] %d.%m %H:%M "
set -g window-status-current-style "fg=colour39,bold"
